{% extends "../note/base.html" %} {% block content %}

<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
  <div
    class="w-full max-w-md bg-white rounded-2xl shadow-lg border border-gray-100 p-8"
  >
    <!-- Title -->
    <h2 class="text-2xl font-bold text-gray-800 text-center mb-6">Welcome</h2>

    <form method="post" class="space-y-4">
      {% csrf_token %} {% for field in form %}
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">
          {{ field.label }}
        </label>

        {{ field }} {% for error in field.errors %}
        <p class="text-red-500 text-sm mt-1">{{ error }}</p>
        {% endfor %}
      </div>
      {% endfor %}

      <button
        type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg"
      >
        Register
      </button>
    </form>
  </div>
</div>

{% endblock %}
