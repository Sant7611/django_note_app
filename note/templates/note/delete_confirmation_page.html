{% extends 'note/base.html' %}


{% block content %}

<div class="max-w-2xl mx-auto px-4 py-10">

    <div class="bg-white border border-gray-200 rounded-2xl shadow-sm p-6 text-center">

        <!-- Warning Icon -->
        <div class="text-red-500 text-4xl mb-4">
            ⚠️
        </div>

        <!-- Heading -->
        <h1 class="text-2xl font-bold text-gray-800 mb-2">
            Delete Note
        </h1>

        <p class="text-gray-600 mb-6">
            Are you sure you want to delete
            <span class="font-semibold text-gray-900">
                "{{ note.title }}"
            </span>?
            This action cannot be undone.
        </p>

        <!-- Buttons -->
        <form method="post" class="flex justify-center gap-4">
            {% csrf_token %}

            <a href="{% url 'notes:notes_list' %}"
               class="px-5 py-2 rounded-lg bg-gray-200 hover:bg-gray-300 text-gray-700">
                Cancel
            </a>

            <button type="submit"
                    class="px-5 py-2 rounded-lg bg-red-500 hover:bg-red-600 text-white shadow">
                Yes, Delete
            </button>
        </form>

    </div>

</div>

{% endblock %}
