{% extends 'note/base.html' %} {% block content %}

<div class="max-w-4xl mx-auto px-4 py-10">
  <!-- Main Card -->
  <div
    class="bg-white p-5 rounded-3xl shadow-xl overflow-hidden border border-gray-100"
  >
    <!-- Image -->
    {% if note.image %}
    <div class="w-64 h-48">
      <img
        src="{{ note.image.url }}"
        alt="{{ note.title }}"
        class="rounded-2xl object-contain shadow-md border border-gray-200"
      />
    </div>
    {% endif %}

    <!-- Content -->
    <div class="p-8">
      <!-- Date Badge -->
      <div class="mb-4">
        <span
          class="inline-block px-4 py-1 text-sm bg-blue-100 text-blue-700 rounded-full"
        >
          📅 {{ note.created_at|date:"F d, Y" }}
        </span>
      </div>

      <!-- Title -->
      <h1 class="text-4xl font-bold text-gray-800 mb-6">{{ note.title }}</h1>

      <!-- Description -->
      <div class="text-gray-600 text-lg leading-8 whitespace-pre-line">
        {{ note.description }}
      </div>

      <!-- Footer -->
      <div
        class="mt-10 pt-6 border-t border-gray-200 flex flex-col md:flex-row justify-between items-center gap-4"
      >
        <!-- Back Button -->
        <a
          href="{% url 'notes:notes_list' %}"
          class="flex items-center gap-2 text-gray-600 hover:text-blue-600 font-medium transition"
        >
          ← Back to Notes
        </a>

        <!-- Action Buttons -->
        <div class="flex gap-4">
          <a
            href="{% url 'notes:notes_edit' note.id %}"
            class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl shadow-lg transition duration-300"
          >
            ✏️ Edit
          </a>

          <a
            href="{% url 'notes:notes_delete' note.id %}"
            class="px-6 py-3 bg-red-500 hover:bg-red-600 text-white rounded-xl shadow-lg transition duration-300"
          >
            🗑 Delete
          </a>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}
