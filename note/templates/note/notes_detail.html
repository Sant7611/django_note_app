{% extends 'note/base.html' %}

{% block content %}

<div class="max-w-3xl mx-auto px-4 py-10">

    <!-- Card -->
    <div class="bg-white border border-gray-200 rounded-2xl shadow-sm p-6">

        <!-- Title -->
        <h1 class="text-2xl font-bold text-gray-800 mb-4">
            {{ note.title }}
        </h1>

        <!-- Meta -->
        <div class="text-sm text-gray-500 mb-6">
            Created on {{ note.created_at|date:"F d, Y" }}
        </div>

        <!-- Description -->
        <div class="text-gray-700 leading-relaxed whitespace-pre-line mb-6">
            {{ note.description }}
        </div>

        <!-- Actions -->
        <div class="flex justify-between items-center pt-4 border-t border-gray-100">

            <a href="{% url 'notes:notes_list' %}"
               class="text-gray-600 hover:text-gray-900">
                ← Back
            </a>

            <div class="space-x-3">
                <a href="{% url 'notes:notes_edit' note.id %}"
                   class="px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg shadow">
                    Edit
                </a>

                <a href="{% url 'notes:notes_delete' note.id %}"
                   class="px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded-lg shadow">
                    Delete
                </a>
            </div>

        </div>

    </div>

</div>

{% endblock %}
